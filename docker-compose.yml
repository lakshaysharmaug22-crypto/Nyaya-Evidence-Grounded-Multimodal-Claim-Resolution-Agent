services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: sh -c "pip install -r requirements.txt && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  web:
    image: node:20
    working_dir: /app/web
    volumes: [".:/app"]
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
