name: authors
on:
  pull_request:
  push:
    branches: [main]
jobs:
  authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject AI attribution
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then range="origin/${{ github.base_ref }}..HEAD"; else range="HEAD"; fi
          if git log $range --format='%an <%ae>%n%B' | grep -qiE "claude|anthropic|co-authored-by|generated with"; then
            echo "AI attribution found"; exit 1
          fi
